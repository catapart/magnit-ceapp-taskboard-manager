<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskboard Manager App Demo</title>
    <link rel="stylesheet" href="./app.css">
    <link rel="stylesheet" href="./themes/course/course.theme.css">
    <style>
        taskboard-manager::part(custom-settings-fieldset)
        {
            color: inherit;
            display: grid;
            align-items: stretch;
            justify-content: flex-start;
        }

        .accent-color .value
        {
            display: inline-flex;
            flex-wrap: wrap;
            gap: var(--gap-small);
        }

        .option.accent
        {
            display: inline-grid;
            gap: var(--gap-small);
            justify-items: center;
            width: 48px;
            padding: var(--gap-small);
            border-radius: 5px;
            border: solid 1px transparent;
        }
        .option.accent:hover
        {
            background-color: rgb(0 0 0 / .2);
            border-color: rgb(0 0 0 / .3);
        }
        .option.accent .display
        {
            display: block;
            overflow: hidden;
            --size: 25px;
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            background-color: var(--accent-color, rgb(0 0 0));
        }
    </style>
</head>
<body>
    <taskboard-manager id="app" data-theme="course" update-url>
        <span slot="custom-settings-legend">Display</span>
        <div class="custom-settings" slot="custom-settings">
            <form-field class="field theme" label="Theme">
                <select id="theme-select"></select>
                <div id="theme-description"></div>
            </form-field>
            <div class="form-field field accent-color">
                <label class="container">
                    <span class="field-label">Accent Color</span>
                    <span class="value">
                        <a class="option accent red" style="--accent-color: #D40D06;">
                            <span class="display">
                                <span class="light"></span>
                                <span class="dark"></span>
                            </span>
                            <span class="label color">Red</span>
                        </a>
                        <a class="option accent orange" style="--accent-color: #EB8C17;">
                            <span class="display">
                                <span class="light"></span>
                                <span class="dark"></span>
                            </span>
                            <span class="label color">Orange</span>
                        </a>
                        <a class="option accent yellow" style="--accent-color: #D49306;">
                            <span class="display">
                                <span class="light"></span>
                                <span class="dark"></span>
                            </span>
                            <span class="label color">Yellow</span>
                        </a>
                        <a class="option accent green" style="--accent-color: #86B33E;">
                            <span class="display">
                                <span class="light"></span>
                                <span class="dark"></span>
                            </span>
                            <span class="label color">Green</span>
                        </a>
                        <a class="option accent blue" style="--accent-color: #1A82BA;">
                            <span class="display">
                                <span class="light"></span>
                                <span class="dark"></span>
                            </span>
                            <span class="label color">Blue</span>
                        </a>
                        <a class="option accent purple" style="--accent-color: #822BD9;">
                            <span class="display">
                                <span class="light"></span>
                                <span class="dark"></span>
                            </span>
                            <span class="label color">Purple</span>
                        </a>
                        <a class="option accent pink" style="--accent-color: #DB7FAF;">
                            <span class="display">
                                <span class="light"></span>
                                <span class="dark"></span>
                            </span>
                            <span class="label color">Pink</span>
                        </a>
                        <a class="option accent gray" style="--accent-color: #A5ADB5;">
                            <span class="display">
                                <span class="light"></span>
                                <span class="dark"></span>
                            </span>
                            <span class="label color">Gray</span>
                        </a>
                    </span>
                </label>
            </div>
        </div>
    </taskboard-manager>
    <script type="module" src="./dist/taskboard-manager.js"></script>
    <script type="module">
        const stylesheets = {};
        const themes = [
            { 
                id: 'course',
                label: "Course",
                description: `The Course theme is a basic implementation of a theme generated from the <a href="https://colorffy.com/">colorffy</a> website's theme generator tool.
                It is a straightforward UX that aims to be self-descriptive and familiar. Its minimalist design supports efficiency in project management.`
            },
            {
                id: 'creative',
                label: "Creative",
                description: "The Creative theme is a style that mimics corkboard and paper notes. This expressive and fun theme is great for display and works well with pointers for tablet-based task management."
            },
            {
                id: 'web-gothic',
                label: "Web Gothic",
                description: `The Web Gothic theme is a minimalist theme that uses its styles to handle layout and mimic the default colors and highlighting of browser elements. You can think of the web gothic theme as \"turning off\" the themes and going back to an \"unstyled\" version of the app.
                This theme is lightweight and nostalgic, but it is mostly useful for creating your own custom themes.`
            },
        ]
        document.addEventListener('DOMContentLoaded', () =>
        {
            const taskboardManager = document.getElementById('app');
            const themeSelect = document.getElementById('theme-select');
            const themeDescription = document.getElementById('theme-description');

            const themeOptions = [];
            for(let i = 0; i < themes.length; i++)
            {
                const theme = themes[i];
                const themeOption = document.createElement('option');
                themeOption.value = theme.id;
                themeOption.textContent = theme.label;
                themeOptions.push(themeOption);
            }
            requestAnimationFrame(() =>
            {
                themeSelect.append(...themeOptions);
                themeSelect.value = 'course';
                // themeSelect.value = 'web-gothic';
                themeSelect.dispatchEvent(new Event('change'));
            });

            themeSelect.addEventListener('change', () =>
            {
                const theme = themes.find(item => item.id == themeSelect.value)
                themeDescription.innerHTML = theme.description;
                taskboardManager.dataset.theme = themeSelect.value;

                if(themeSelect.value == 'creative' || themeSelect.value == 'dossier')
                {
                    taskboardManager.classList.add('button-vars');
                }
                else
                {
                    taskboardManager.classList.remove('button-vars');
                }

                if(themeSelect.value == 'creative' && document.head.querySelector('link[href="./themes/creative/creative.theme.css"]') == null)
                {
                    const link = document.createElement('link');
                    link.rel = 'stylesheet';
                    link.type = 'text/css';
                    link.href = './themes/creative/creative.theme.css';

                    document.head.appendChild(link);
                }
            });


            const accentColorValue = document.querySelector('.accent-color .value');
            accentColorValue.addEventListener('click', (event) =>
            {
                const composedPath = event.composedPath();

                const option = composedPath.find(item => item instanceof HTMLAnchorElement && item.classList.contains('accent'));
                if(option != null)
                {
                    taskboardManager.style.setProperty('--accent-color-1', option.style.getPropertyValue('--accent-color'));
                }
            });

        });
    </script>
</body>
</html>
