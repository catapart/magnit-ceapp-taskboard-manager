<fieldset id="welcome-fieldset">
    <legend id="welcome-legend">Welcome</legend>
    <header id="welcome-header" class="panel-header">
        <svg id="welcome-logo" class="logo">
            <use href="#icon-definition_logo"></use>
        </svg>
    </header>
    <div id="welcome-description" class="description">
        <p id="welcome-text" class="text">Welcome to your Taskboard Manager!</p>
        <p id="create-text" class="text">Create a <a id="new-board-link" class="link">new board</a>, or select a recently-opened board below.</p>
    </div>
    <fieldset id="recent-fieldset">
        <legend id="recent-legend">Recent Boards</legend>
        <editable-list id="recent-boards" placeholder="[No recently opened boards found]" remove-class="button recent-board-remove-button icon-button" exportparts="edit:edit-button, handle: edit-handle, button, remove:remove-button, items:recent-board-items, placeholder">
            <button type="button" slot="add" id="new-board-button" class="new-board-button label-button recent" title="New Board">
                <svg class="icon plus recent" >
                    <use href="#icon-definition_plus"></use>
                </svg>
                <span class="label">New Board</span>
            </button>
            <template part="remove-button">
                <svg class="icon button-icon remove recent">
                    <use href="#icon-definition_close-cross"></use>
                </svg>
            </template>
        </editable-list>
    </fieldset>
</fieldset>
