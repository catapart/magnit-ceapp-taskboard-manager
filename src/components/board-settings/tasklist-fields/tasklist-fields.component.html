<details class="details" id="tasklist-settings-details">
    <summary class="summary" id="tasklist-settings-summary">
        <div class="handle" id="tasklist-settings-handle"></div>
        <input class="input color" id="tasklist-color" name="tasklist-color" type="color" />
        <input class="input name" id="tasklist-name" name="tasklist-name" type="text" />
        <button class="duplicate-button icon-button" id="tasklist-settings-duplicate-button" type="button">
            <svg class="icon copy" id="tasklist-settings-duplicate-icon">
                <use href="#icon-definition_copy"></use>
            </svg>
        </button>
        <button class="button icon-button" id="tasklist-settings-remove-button" type="button">
            <svg class="icon" id="tasklist-settings-remove-icon">
                <use href="#icon-definition_cancel-cross"></use>
            </svg>
            <svg class="icon" id="tasklist-settings-undo-icon">
                <use href="#icon-definition_undo-redo"></use>
            </svg>
        </button>
    </summary>
    <div class="details-content" id="task-fields-content">
        <fieldset class="fieldset" id="tasklist-settings-fieldset">
            <legend class="legend" id="tasklist-settings-legend">List</legend>
            <div class="fieldset-column first">
                <form-field class="field"  id="tasklist-background-color-field"label="Background Color" optional optional-title="Override Background Color?">
                    <input class="input color" id="tasklist-background-color" type="color" name="background-color" value="#f9faf5" />
                </form-field>
                <form-field class="field" id="tasklist-font-color-field" label="Font Color" optional optional-title="Override Font Color?">
                    <input class="input color" id="tasklist-font-color" type="color" name="font-color" value="#060703" />
                </form-field>
            </div>
            <div class="fieldset-column second">
                <form-field class="field" id="tasklist-order-field" label="Order" >
                    <input class="input" id="tasklist-order" type="text" name="order" inputmode="numeric" disabled />
                </form-field>
                <form-field class="field" id="tasklist-width-field" label="List Width" optional optional-title="Use a custom list width?">
                    <input class="input" id="tasklist-width" type="text" inputmode="numeric" name="list-width" value="" />
                    <span class="postfix" id="tasklist-width-unit" slot="postfix">px</span>
                </form-field>
                <form-field class="field" id="tasklist-color-display-field" label="Color Display">
                    <select class="select" id="tasklist-color-display" name="color-display"></select>
                </form-field>
            </div>
        </fieldset>
        <fieldset class="fieldset" id="task-settings-fieldset">
            <legend class="legend" id="task-settings-legend">List Tasks</legend>
            <task-fields
                id="task-settings"
                exportparts="fieldset,
                             legend,
                             field,
                             input,
                             select,
                             option,
                             first,
                             last,
                             label-button,
                             icon-button,
                             container,
                             field-container,
                             label,
                             field-label,
                             enabled-checkbox,
                             field-enabled-checkbox,
                             prefix,
                             field-prefix,
                             postfix,
                             field-postfix,
                             task-appearance-fieldset,
                             task-appearance-legend,
                             task-font-size-field,
                             task-font-size,
                             font-size-unit,
                             task-background-color-field,
                             task-background-color,
                             task-border-radius-field,
                             task-border-radius,
                             task-border-bottom-unit,
                             task-font-color-field,
                             task-font-color,
                             task-color-display-field,
                             task-color-display,
                             task-border-color-field,
                             task-border-color,
                             task-layout-fieldset,
                             task-layout-fields-legend,
                             task-center-checkbox-field,
                             task-center-checkbox,
                             task-center-remove-button-field,
                             task-center-remove-button,
                             task-card-width-field,
                             task-card-width,
                             task-card-width-unit,
                             task-border-weights-fieldset,
                             task-border-weights-legend,
                             task-border-top-field,
                             task-border-top,
                             task-border-top-unit,
                             task-border-right-field,
                             task-border-right,
                             task-border-right-unit,
                             task-border-botom-field,
                             task-border-botom,
                             task-border-botom-unit,
                             task-border-left-field,
                             task-border-left,
                             task-border-left-unit
                            "
            ></task-fields>
        </fieldset>
    </div>
</details>
