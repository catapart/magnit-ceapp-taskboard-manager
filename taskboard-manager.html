<dialog id="confirmation-dialog" class="dialog">

    </header>
    <path-router id="confirmation-router" class="router">
        <route-page id="confirmation-info" class="confirmation-page" path="info"></route-page>
        <route-page id="confirmation-warn" class="confirmation-page" path="warn"></route-page>
        <route-page id="confirmation-danger" class="confirmation-page" path="danger"></route-page>
    </path-router>
    <footer id="confirmation-dialog-footer" class="footer dialog-footer">
        <form id="confirmation-dialog-form" method="dialog">
            <button type="submit" id="confirmation-cancel-button" class="button action-button cancel">Cancel</button>
            <button type="submit" id="confirmation-confirm-button" class="button action-button ok preferred-button">Confirm</button>
        </form>
    </footer>
</dialog>
