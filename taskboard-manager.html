<app-menu id="app-menu"></app-menu>
<path-router id="app-router" path="">
    <route-page id="welcome-page">
        <welcome-panel id="welcome-panel"></welcome-panel>
    </route-page>
    <route-page path="board/:id" id="board-route">
        <task-board part="task-board" id="task-board" exportparts="lists:task-board-lists"></task-board>
    </route-page>
    <dialog part="board-browser-dialog" class="dialog" is="route-dialog" path="boards">
        <board-browser id="board-browser"></board-browser>
    </dialog>
    <dialog part="dialog config-dialog" class="dialog" is="route-dialog" path="config">
        <config-panel id="config-panel">
            <slot name="custom-settings" slot="custom-settings"></slot>
        </config-panel>
    </dialog>
    <dialog id="board-settings-dialog" class="dialog" is="route-dialog" path="board-settings">
        <board-settings id="board-settings"></board-settings>
    </dialog>
    <dialog id="import-dialog" class="dialog" is="route-dialog" path="import">
        <import-manager id="import-manager"></import-manager>
    </dialog>
</path-router>
<dialog id="confirmation-dialog" class="dialog">
    <header id="confirmation-dialog-header">
        <svg id="confirmation-dialog-icon" class="icon">
            <use href="#icon-definition_import"></use>
        </svg>
        <span id="confirmation-dialog-title">Confirmation</span>
    </header>
    <path-router id="confirmation-router">
        <route-page id="confirmation-info" class="confirmation-page" path="info"></route-page>
        <route-page id="confirmation-warn" class="confirmation-page" path="warn"></route-page>
        <route-page id="confirmation-danger" class="confirmation-page" path="danger"></route-page>
    </path-router>
    <footer id="confirmation-dialog-footer">
        <form id="confirmation-dialog-form" method="dialog">
            <button type="submit" id="confirmation-cancel-button">Cancel</button>
            <button type="submit" id="confirmation-confirm-button">Confirm</button>
        </form>
    </footer>
</dialog>
<div id="notifications" id="notifications"></div>
<div id="loading"></div>
